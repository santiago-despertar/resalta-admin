<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Resalta · Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234A5866'/><text x='16' y='22' font-family='Helvetica' font-size='17' fill='white' text-anchor='middle'>r</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--surface:#F3F1EC;--raised:#FFFFFF;--mist:#E3E7EA;--ink:#16191D;--muted:#5B6470;--slate:#6E7E8E;--deep:#4A5866;--sand:#CFE4FF;--line:#D3D8DD;--ok:#3F7A57;--bad:#A24B3E;--warn:#9A7524;
--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{overflow-x:clip}html,body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}a{color:var(--deep)}
.hide{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:20;background:rgba(243,241,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.logo{font-size:19px;letter-spacing:-.01em}.logo small{font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--slate)}.btn.p{background:var(--deep);border-color:var(--deep);color:#fff}
select.btn{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px;scroll-padding:0 20px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:7px 13px;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:#fff}
main.wrap{padding-top:28px;padding-bottom:60px}
h2{font-size:22px;font-weight:400;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:500;margin:0 0 12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}.grid>*,.cal>*{min-width:0}.card{min-width:0;overflow-wrap:anywhere}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi .v{font:500 26px/1.1 var(--mono);letter-spacing:-.02em;margin-top:6px}
.kpi .l{font-size:12.5px;color:var(--muted)}.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.two,.three{grid-template-columns:minmax(0,1fr)}}
.tbl{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--raised)}
td{padding:9px 10px;border-bottom:1px solid var(--mist);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#F8F7F3}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--mist);color:var(--ink);white-space:nowrap}
.pill.ok{background:#E2EEE6;color:var(--ok)}.pill.bad{background:#F4E3DF;color:var(--bad)}.pill.warn{background:#F3EBD9;color:var(--warn)}.pill.d{background:var(--deep);color:#fff}
.mut{color:var(--muted)}.mono{font-family:var(--mono)}
.search{width:100%;max-width:360px;border:1px solid var(--line);border-radius:999px;background:var(--raised);padding:9px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.funnel .st{display:grid;grid-template-columns:minmax(120px,220px) 1fr 90px;gap:12px;align-items:center;padding:7px 0}
.funnel .tr{height:26px;background:var(--mist);border-radius:7px;overflow:hidden}.funnel .fl{height:100%;background:var(--deep);border-radius:7px}
.funnel .pc{font-family:var(--mono);text-align:right;font-size:13px}
@media(max-width:600px){.funnel .st{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}.funnel .tr{grid-column:1/-1;order:3;height:18px}}
.hbar{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.hbar .t{height:8px;background:var(--mist);border-radius:4px;overflow:hidden}.hbar .f{height:100%;background:var(--slate)}
.hbar .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.load{padding:40px;text-align:center;color:var(--muted)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:380px;padding:30px}
.login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0 12px;background:#fff}
.login .btn{width:100%;padding:11px;margin-top:4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;margin:0 0 20px}
.h-user{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:18px}.h-user .mut{font-size:15px;word-break:break-all}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photos a{display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--mist);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.cals{display:grid;gap:12px}
.cal{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;padding:12px;border:1px solid var(--line,#E3E7EA);border-radius:12px}
.cal .photos{grid-template-columns:1fr}.cal .photos img{object-fit:contain;background:#16191D}
.cal .sinfoto{aspect-ratio:3/4;border-radius:10px;background:var(--mist);display:grid;place-items:center;text-align:center;font-size:11.5px;padding:10px}
.mini{width:34px;height:44px;border-radius:6px;object-fit:cover;display:block;background:var(--mist)}
.ucell{display:flex;gap:10px;align-items:center}
@media(max-width:600px){.cal{grid-template-columns:110px 1fr;gap:12px;padding:10px}}
.photos span{position:absolute;left:6px;bottom:6px;font-size:10.5px;background:rgba(22,25,29,.7);color:#fff;padding:2px 6px;border-radius:6px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dl.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;word-break:break-word}
.chat{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:9px 12px;border-radius:12px;max-width:85%;font-size:13px;white-space:pre-wrap}
.msg.u{background:var(--deep);color:#fff;align-self:flex-end}.msg.a{background:var(--mist)}
.sec{margin-top:14px}
pre.j{white-space:pre-wrap;word-break:break-word;font:12px/1.5 var(--mono);background:#F8F7F3;border-radius:10px;padding:12px;max-height:380px;overflow:auto;margin:0}
details summary{cursor:pointer;color:var(--deep);font-size:13px;margin:8px 0}
.lightbox{position:fixed;inset:0;background:rgba(10,12,14,.9);z-index:50;display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:92vh;border-radius:10px}
.gen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.gen label{font-size:12px;color:var(--muted);display:block}
.gen select,.gen input{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.out{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.out code{flex:1;min-width:0;overflow-wrap:anywhere;font:12.5px/1.4 var(--mono);background:#F8F7F3;border-radius:10px;padding:10px 12px}
@media(max-width:900px){.gen{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.wrap{padding:0 14px}.kpis{gap:10px}.kpi .v{font-size:20px}.kpi .s{font-size:11.5px}.card{padding:14px}.bar .who{display:none}main.wrap{padding-top:24px}.h-user .mut{font-size:13.5px}nav.tabs{margin:0 -14px;padding-left:14px;padding-right:14px}}
.ed label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.ed input,.ed textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.ed textarea{min-height:420px;font:13px/1.55 var(--mono);resize:vertical}
.prev{background:#F3F1EC;border-radius:12px;padding:18px;max-height:640px;overflow:auto}
.prev .m{background:#fff;border-radius:12px;padding:22px;max-width:520px;margin:0 auto;font:15px/1.6 Helvetica,Arial,sans-serif}
.prev .m p{margin:0 0 12px}.prev .b{display:inline-block;background:#4A5866;color:#fff;border-radius:999px;padding:11px 22px;text-decoration:none;margin:6px 0 14px}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--mist)}.al:last-child{border:0}
.seq{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

@media(max-width:640px){
  /* iOS zooms in on any field under 16px: keep every field at 16px */
  input,select,textarea,.search,select.btn{font-size:16px!important}
  .bar{gap:8px;height:56px}.logo{font-size:18px}.logo small{margin-left:4px;font-size:11px}
  .btn{padding:8px 12px}
  h2{font-size:20px}h2 .mut{display:block;font-size:13.5px!important;margin-top:2px}
  .search{max-width:none;flex:1 1 100%}
  .gen{grid-template-columns:minmax(0,1fr)}
  .out .btn{flex:1 1 100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal{grid-template-columns:96px minmax(0,1fr)}
  dl.kv{grid-template-columns:minmax(0,42%) minmax(0,1fr)}
  .prev{padding:10px}.prev .m{padding:16px}
  .ed textarea{min-height:300px}
  .msg{max-width:92%}
  .row[style*="space-between"]{gap:6px}
  /* wide tables scroll sideways inside their card; the page itself never moves */
  .tbl{overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
  .tbl table{width:max-content;min-width:100%}
  .tbl td{white-space:nowrap}
  .tbl td:first-child,.tbl th:first-child{position:sticky;left:0;z-index:1;background:var(--raised);box-shadow:1px 0 0 var(--mist)}
  .tbl th:first-child{z-index:2}
  .tbl td:first-child{white-space:normal;min-width:150px;max-width:210px}
  tr.click:hover td{background:none}
}
.pager{justify-content:center;gap:12px;margin:14px 0 0}.pager:empty{display:none}.btn.danger{color:#B42318;border-color:#F1C4BF}.btn:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div id="login" class="login hide">
  <div class="card">
    <p class="logo" style="margin:0 0 4px">resalta<small>admin</small></p>
    <p class="mut" style="margin:0 0 20px">Solo para cuentas de administrador.</p>
    <button class="btn" id="google" type="button">Entrar con Google</button>
    <p class="mut" style="text-align:center;margin:16px 0 8px;font-size:12px">o con correo</p>
    <form id="fl">
      <label>Correo<input type="email" id="em" autocomplete="username" required></label>
      <label>Contraseña<input type="password" id="pw" autocomplete="current-password" required></label>
      <button class="btn p" type="submit">Entrar</button>
    </form>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" class="hide">
  <header class="top"><div class="wrap">
    <div class="bar">
      <span class="logo">resalta<small>admin</small></span>
      <span class="sp"></span>
      <select class="btn" id="rango" aria-label="Periodo">
        <option value="1">Hoy</option><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option><option value="365">12 meses</option>
      </select>
      <span class="mut who" id="who"></span>
      <button class="btn" id="salir" type="button">Salir</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-v="resumen" class="on">Resumen</button><button data-v="analitica">Analítica</button><button data-v="anuncios">Anuncios</button><button data-v="enlaces">Enlaces</button><button data-v="usuarios">Usuarios</button>
      <button data-v="pedidos">Pedidos</button><button data-v="leads">Leads</button><button data-v="afiliados">Afiliados</button><button data-v="diagnostico">Diagnóstico</button><button data-v="secuencias">Secuencias</button><button data-v="correos">Correos</button><button data-v="costos">Costos</button><button data-v="eventos">Eventos en vivo</button>
    </nav>
  </div></header>
  <main class="wrap" id="main"><div class="load">Cargando…</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
const URL_SB="https://jxluabbugwdonqchbaxm.supabase.co", KEY="sb_publishable_WPce-iugGd2zyglAsGfnLQ_nR-JUXYI";
const sb=window.supabase.createClient(URL_SB,KEY,{auth:{storageKey:"resalta-admin"}});
const $=s=>document.querySelector(s), main=$("#main");
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mxn=n=>"$"+Math.round(n||0).toLocaleString("es-MX");
const num=n=>(n||0).toLocaleString("es-MX");
const pct=(a,b)=>b?((a/b)*100).toFixed(a/b<.1?1:0)+"%":"–";
const fecha=t=>t?new Date(t).toLocaleString("es-MX",{timeZone:"America/Mexico_City",day:"2-digit",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"–";
const dia=t=>t?new Date(t).toLocaleDateString("es-MX",{timeZone:"America/Mexico_City",day:"2-digit",month:"short"}):"–";
const hace=t=>{if(!t)return"–";const s=(Date.now()-new Date(t))/1e3;if(s<60)return"ahora";if(s<3600)return Math.floor(s/60)+" min";if(s<86400)return Math.floor(s/3600)+" h";return Math.floor(s/86400)+" d";};
const EST={pagado:"ok",listo:"ok",borrador:"",active:"ok",trialing:"ok",canceled:"bad",past_due:"warn",incomplete:"warn",error:"bad",generando:"warn"};
const pill=(t,k)=>t?`<span class="pill ${k!=null?k:(EST[t]||"")}">${esc(t)}</span>`:`<span class="mut">–</span>`;
const plan=t=>t==="hard"?"Completo":t==="soft"?"Esencial":t;
const EVN={calificacion_resultado:"Vio su resultado",page_view:"Vista",generate_lead:"Lead",sign_up:"Registro",login:"Entró",google_clic:"Clic en Google",begin_checkout:"Inicio de pago",purchase:"Compra",afiliado_alta:"Alta afiliado",afiliado_registro:"Registro afiliado"};

async function api(accion,extra){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw Object.assign(new Error("sesion"),{code:401});
  const r=await fetch(URL_SB+"/functions/v1/admin",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+session.access_token},body:JSON.stringify({accion,...(extra||{})})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||"Error"),{code:r.status});
  return j;
}

// ---------- auth ----------
async function arrancar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ mostrarLogin(); return; }
  try{ const yo=await api("yo"); $("#who").textContent=yo.email; $("#login").classList.add("hide"); $("#app").classList.remove("hide"); ir(location.hash.slice(1)||"resumen"); }
  catch(e){ mostrarLogin(e.code===403?"Esta cuenta no tiene acceso de administrador.":e.code===401?"":"No se pudo verificar tu acceso."); if(e.code===403) await sb.auth.signOut(); }
}
function mostrarLogin(msg){ $("#app").classList.add("hide"); $("#login").classList.remove("hide"); $("#lerr").textContent=msg||""; }
$("#google").onclick=()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/"}});
$("#fl").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error){$("#lerr").textContent="Correo o contraseña incorrectos.";return;}arrancar();};
$("#salir").onclick=async()=>{await sb.auth.signOut();location.hash="";mostrarLogin();};
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_IN"&&$("#app").classList.contains("hide")) arrancar(); });

// ---------- navigation ----------
let vista="resumen";
const dias=()=>Number($("#rango").value);
$("#rango").onchange=()=>ir(vista);
$("#tabs").onclick=e=>{const b=e.target.closest("button[data-v]");if(b)ir(b.dataset.v);};
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==vista)ir(h,true);});
async function ir(v,desdeHash){
  const [base,arg]=v.split("/");
  vista=v; if(!desdeHash&&location.hash.slice(1)!==v) location.hash=v;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===base||((base==="usuario"||base==="lead")&&b.dataset.v==="usuarios")));
  const act=$("#tabs button.on"); if(act){const n=$("#tabs");n.scrollTo({left:Math.max(0,act.offsetLeft-n.offsetLeft-14),behavior:"smooth"});}
  $("#rango").classList.toggle("hide",!["resumen","analitica","enlaces","diagnostico","anuncios"].includes(base));
  main.innerHTML='<div class="load">Cargando…</div>'; window.scrollTo(0,0);
  try{
    if(base==="resumen") await vResumen();
    else if(base==="analitica") await vAnalitica();
    else if(base==="enlaces") await vEnlaces();
    else if(base==="usuarios") await vUsuarios();
    else if(base==="usuario") await vUsuario(arg);
    else if(base==="lead") await vLead(decodeURIComponent(arg||""));
    else if(base==="pedidos") await vPedidos();
    else if(base==="leads") await vLeads();
    else if(base==="afiliados") await vAfiliados();
    else if(base==="costos") await vCostos();
    else if(base==="anuncios") await vAnuncios();
    else if(base==="eventos") await vEventos();
    else if(base==="diagnostico") await vDiagnostico();
    else if(base==="secuencias") await vSecuencias(arg);
    else if(base==="correos") await vCorreos(arg?decodeURIComponent(arg):"");
    else await vResumen();
  }catch(e){ if(e.code===401||e.code===403){mostrarLogin(e.code===403?"Esta cuenta no tiene acceso.":"Tu sesión terminó. Entra de nuevo.");return;} main.innerHTML=`<div class="card empty">No se pudo cargar: ${esc(e.message)}</div>`; }
}

// ---------- charts (plain SVG) ----------
function lineas(serie,claves,{alto=220}={}){
  const ang=window.innerWidth<640, W=ang?380:720,H=ang?Math.round(alto*.75):alto,P={l:ang?34:38,r:8,t:12,b:26}, n=serie.length;
  if(!n) return '<div class="empty">Sin datos</div>';
  const max=Math.max(1,...serie.flatMap(d=>claves.map(c=>d[c.k]||0)));
  const tope=Math.ceil(max/Math.pow(10,Math.floor(Math.log10(max))))*Math.pow(10,Math.floor(Math.log10(max)));
  const x=i=>P.l+(n===1?(W-P.l-P.r)/2:i*(W-P.l-P.r)/(n-1)), y=v=>H-P.b-(v/tope)*(H-P.t-P.b);
  let g="";
  for(let i=0;i<=4;i++){const v=tope*i/4,yy=y(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#E3E7EA"/><text x="${P.l-6}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="#5B6470" font-family="JetBrains Mono">${Math.round(v).toLocaleString("es-MX")}</text>`;}
  const paso=Math.max(1,Math.ceil(n/(ang?5:8)));

  });

function barrasH(pares,{total,max=10,extra}={}){

  const tope=Math.max(...pares.map(p=>p[1]))||1, t=total||pares.reduce((s,p)=>s+p[1],0);

let SEQ=null;
function renderCorreo(cuerpo,fl){
  let s=cuerpo.replace(/\[\[(\w+)\]\]([\s\S]*?)\[\[\/\1\]\]\n?/g,(_,k,t)=>fl[k]?t:"");
  s=s.replace(/\{nombre\}/g,"Ana").replace(/\{objetivo\}/g,"tu cabello y cejas").replace(/\{puntaje\}/g,"72").replace(/\{fuerte\}/g,"tus ojos").replace(/\{debil\}/g,"tu mandíbula");
  return s.split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";const bt=b.match(/^\{boton:(.+)\}$/);if(bt)return`<a class="b">${esc(bt[1])}</a>`;const im=b.match(/^\{imagen:(.+)\}$/);if(im)return`<img src="${esc(/^https?:/.test(im[1])?im[1]:"https://resalta.co"+im[1])}" alt="" style="width:100%;border-radius:10px;margin:0 0 12px">`;const da=b.match(/^\{dato:([^|}]+)\|([^}]+)\}$/);if(da)return`<p style="text-align:center"><b style="font-size:34px;font-weight:300">${esc(da[1])}</b><br><span class="mut" style="font-size:12px">${esc(da[2])}</span></p>`;return`<p>${esc(b).replace(/\n/g,"<br>")}</p>`;}).join("");
}

    {t:"Enviados",n:1,f:g=>num(g.env)+(g.fall?` <span class="mut">(${g.fall} fallaron)</span>`:"")},
    {t:"Abiertos",n:1,f:g=>pctTxt(g.ab,g.env)},{t:"Con clic",n:1,f:g=>pctTxt(g.cl,g.env)}],filas)}</div>
  <div class="card sec"><h3>Todos los envíos</h3>${buscador("qc",todos,fs=>tablaCorreos(fs.slice(0,500),{conPersona:true,cuentas}),c=>[c.email,c.asunto,c.secuencia,TIPO_CORREO[c.tipo]])}</div>`;
}

async function vSecuencias(arg){
  if(!SEQ||!arg) SEQ=await api("secuencias");
  const nombres=NOMBRES_SEC;
  const grupos={}; for(const c of SEQ.correos)(grupos[c.secuencia]??=[]).push(c);
  if(arg){ const [sec,paso]=arg.split("-"); const c=(grupos[sec]||[]).find(x=>String(x.paso)===paso); if(c) return editarCorreo(c,nombres); }
  const st=SEQ.stats;
  const orden=k=>({general:0,gratis:1}[k]??9);
  main.innerHTML=`<h2>Secuencias</h2><p class="mut" style="margin:-6px 0 14px;max-width:760px"><b style="font-weight:500">General:</b> le llega a quien contestó el formulario del plan y no pagó. <b style="font-weight:500">Calificación gratis:</b> a quien solo hizo la calificación gratis; si después empieza el formulario, pasa a la general. Las dos se detienen si compra o se da de baja. Las otras están apagadas (sin personas). Haz clic en un correo para leerlo o cambiarlo.</p>
  ${Object.keys(grupos).sort((a,b)=>orden(a)-orden(b)).map(k=>{const x=st[k]||{};return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${esc(nombres[k]||k)}</h3><span class="mut" style="font-size:12.5px">${num(x.inscritos)} entraron · ${num(x.activos)} activos · <b style="font-weight:500;color:var(--ok)">${num(x.compraron)} compraron</b> · ${num(x.bajas)} bajas</span></div>
  ${tabla([{t:"#",f:c=>c.paso},{t:"Día",n:1,f:c=>c.dias},{t:"Asunto",f:c=>`${esc(c.asunto)}${c.activo?"":` ${pill("Pausado","warn")}`}`},{t:"Enviados",n:1,f:c=>num(c.enviados)+(c.fallidos?` <span class="mut">(${c.fallidos} fallaron)</span>`:"")},{t:"Abiertos",n:1,f:c=>pctTxt(c.abiertos,c.enviados)},{t:"Clics",n:1,f:c=>num(Math.max(c.clics,c.clics_correo||0))},{t:"Compras",n:1,f:c=>num(c.compras)}],grupos[k],{click:c=>`secuencias/${c.secuencia}-${c.paso}`})}</div>`;}).join("")}`;
}
function editarCorreo(c,nombres){
  main.innerHTML=`<div class="row" style="margin-bottom:20px"><a class="btn back" style="margin:0" href="#secuencias">← Secuencias</a><span class="mut">${esc(nombres[c.secuencia]||c.secuencia)} · correo ${c.paso} de ${SEQ.correos.filter(x=>x.secuencia===c.secuencia).length}</span></div>
  <div class="grid two"><div class="card ed">
    <label>Asunto</label><input id="e-as" maxlength="200" value="${esc(c.asunto)}">
    <label>Se envía el día (desde que dejó el onboarding)</label><input id="e-di" type="number" min="0" max="90" value="${esc(c.dias)}">
    <label>Texto</label><textarea id="e-cu">${esc(c.cuerpo)}</textarea>
    <p class="mut" style="font-size:12px;margin:8px 0 0">{nombre} pone su nombre. {boton:Texto} es el botón a su análisis. En la de calificación gratis también: {puntaje}, {fuerte}, {debil}, y los bloques [[alto]] (80 o más), [[bajo]], [[hombre]] y [[mujer]]. Lo que va entre [[sin_proc]] y [[/sin_proc]] solo lo ve quien no quiere procedimientos; igual con [[proc]], [[cirugia]] y [[presupuesto_bajo]].</p>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="e-ac" style="width:auto" ${c.activo?"checked":""}> Activo</label>
    <div class="row" style="margin:14px 0 0"><button class="btn p" id="e-gu">Guardar</button><span id="e-ms" class="mut"></span></div>
  </div><div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Vista previa</h3><select class="btn" id="e-pv"><option value="sin_proc">Sin procedimientos</option><option value="proc,cirugia,presupuesto_bajo">Abierto a cirugía, presupuesto bajo</option><option value="proc">Abierto a procedimientos</option><option value="bajo,hombre">Gratis: puntaje bajo, hombre</option><option value="alto,mujer">Gratis: puntaje alto, mujer</option></select></div>
    <div class="prev"><p class="mut" style="font-size:12px;margin:0 0 10px" id="pv-as"></p><div class="m" id="pv"></div></div></div></div>`;
  const pv=()=>{const fl={};$("#e-pv").value.split(",").forEach(k=>fl[k]=1);$("#pv").innerHTML=renderCorreo($("#e-cu").value,fl);$("#pv-as").textContent="Asunto: "+$("#e-as").value.replace(/\{nombre\}/g,"Ana");};
  ["#e-cu","#e-as"].forEach(s=>$(s).oninput=pv);$("#e-pv").onchange=pv;pv();
  $("#e-gu").onclick=async()=>{const b=$("#e-gu");b.disabled=true;$("#e-ms").textContent="Guardando…";
    try{await api("guardar_correo",{id:c.id,asunto:$("#e-as").value,cuerpo:$("#e-cu").value,dias:Number($("#e-di").value),activo:$("#e-ac").checked});
      Object.assign(c,{asunto:$("#e-as").value,cuerpo:$("#e-cu").value,dias:Number($("#e-di").value),activo:$("#e-ac").checked});$("#e-ms").textContent="Guardado. Los próximos envíos ya usan este texto.";}
    catch(e){$("#e-ms").textContent=e.message;}b.disabled=false;};
}

let vivo=null;
async function vEventos(){
  clearInterval(vivo);
  const pinta=async()=>{
    if(vista!=="eventos"){clearInterval(vivo);return;}
    const {eventos}=await api("eventos",{limite:300});
    const out=$("#ev-out"); if(!out) return;
    out.innerHTML=tabla([{t:"Cuándo",f:e=>`${fecha(e.ts)}<br><span class="mut">hace ${hace(e.ts)}</span>`},{t:"Evento",f:e=>e.nombre==="purchase"?pill("Compra","ok"):e.nombre==="page_view"?esc("Vista"):pill(EVN[e.nombre]||e.nombre,"d")},
      {t:"Página",f:e=>esc(e.path)},{t:"Fuente",f:e=>esc(e.utm_source||(e.ref?e.ref.replace(/^https?:\/\/(www\.)?/,"").split("/")[0]:"directo"))},{t:"Campaña",f:e=>esc(e.utm_campaign||"–")},
      {t:"Visitante",f:e=>`<span class="mono mut">${esc((e.vid||"").slice(0,6))}</span>${e.user_id?` <a href="#usuario/${esc(e.user_id)}">cuenta</a>`:""}`},{t:"Disp.",f:e=>esc(e.dispositivo||"")},{t:"País",f:e=>esc(e.pais||"–")}],eventos);
  };
  main.innerHTML=`<h2>Eventos en vivo</h2><p class="mut" style="margin:-6px 0 14px">Los últimos 300 eventos del sitio. Se actualiza cada 20 segundos.</p><div class="card" id="ev-out"><div class="load">Cargando…</div></div>`;
  await pinta(); vivo=setInterval(pinta,20000);
}

arrancar();
})();
</script>
</body>
